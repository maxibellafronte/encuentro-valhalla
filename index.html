// Cliente real de Supabase: maneja el login y guarda/renueva la sesión (JWT) sola.
const sbClient = window.supabase.createClient(SUPA_URL, SUPA_KEY);

// Devuelve el access_token del usuario logueado (o null si no hay sesión activa).
async function getAuthToken() {
  const {data} = await sbClient.auth.getSession();
  return data && data.session ? data.session.access_token : null;
}

// token=null => lecturas públicas con la key anónima. Las escrituras SIEMPRE
// necesitan un token de sesión real; si no hay, Supabase las rechaza por RLS
// (el chequeo de "admin" ya no depende solo del front, lo hace el backend).
function authHeaders(token) {
  return {'apikey':SUPA_KEY,'Authorization':'Bearer '+(token||SUPA_KEY),'Content-Type':'application/json'};
}

async function dbGet(key) {
  try {
    const r = await fetch(SUPA_URL+'/rest/v1/competition?key=eq.'+encodeURIComponent(key)+'&select=data', {headers:authHeaders()});
    const rows = await r.json();
    return Array.isArray(rows) && rows.length > 0 ? rows[0].data : null;
  } catch(e) { console.error('dbGet error',e); return null; }
}

async function dbSet(key, value) {
  try {
    const token = await getAuthToken();
    const r = await fetch(SUPA_URL+'/rest/v1/competition?on_conflict=key', {
      method:'POST',
      headers:{...authHeaders(token),'Prefer':'resolution=merge-duplicates'},
      body: JSON.stringify({key, data:value, updated_at:new Date().toISOString()})
    });
    if (!r.ok) { const t = await r.text(); console.error('dbSet error', r.status, t); throw new Error('Supabase error '+r.status+': '+t); }
  } catch(e) { console.error('dbSet error',e); throw e; }
}

async function dbDeleteByKey(key, token) {
  const r = await fetch(SUPA_URL+'/rest/v1/competition?key=eq.'+encodeURIComponent(key), {
    method:'DELETE',
    headers:authHeaders(token)
  });
  if (!r.ok) { const t = await r.text(); throw new Error('Delete error '+r.status+': '+t); }
}

// Config base: 8 estaciones, todas con tiempo en formato mm:ss (menor
// tiempo = mejor). La cantidad se controla desde el panel de Config
// (agregar / quitar la última), no es un número fijo.
// Cada estación tiene un nombre ("Estación 1") y debajo el ejercicio ("Ski").
const DEFAULT_SUBS = ['Ski','Sled Push','Sled Pull','Burpee','Row','Farmer','Lunges','Wall balls'];
const BASE_CONFIG = {
  name: 'CROSSFIT COMPETITION',

};

// Si una config guardada no tiene ejercicio en alguna estación (todavía no
// pasó por el panel de Config), completa con el valor por defecto.
function withDefaultSubs(cfg) {
  return {...cfg, events:(cfg.events||[]).map((ev,i)=>({...ev, sub: ev.sub!==undefined ? ev.sub : (DEFAULT_SUBS[i]||'')}))};
}

// ── Utilidades ────────────────────────────────────────────
function parseScore(s) {
  if (!s || String(s).trim() === '') return null;
  s = String(s).trim();
  // mm:ss — también acepta "3.02" o "3,02" (error de tipeo muy común) como 3:02
  const m = s.match(/^(\d+)[:.,](\d{2})$/);
  if (m) return parseInt(m[1])*60 + parseInt(m[2]);
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

// Segundos -> m:ss (con signo si es negativo, p. ej. un error de carga).
function fmtDur(sec) {
  const s = Math.round(Math.abs(sec));
  return (sec < 0 ? '-' : '') + Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

// Los tiempos cargados son ACUMULADOS (reloj corrido hasta cada estación).
// El tiempo de cada tramo es estación k − estación k−1 (la 1ª es el valor tal
// cual). null si falta algún dato.
function calcIntervals(raw) {
  return raw.map((r,k)=>{
    const cur = parseScore(r);
    if (cur === null) return null;
    if (k === 0) return cur;
    const prev = parseScore(raw[k-1]);
    return prev === null ? null : cur - prev;
  });
}

// Tiempo total de un equipo: el cargado aparte o, si falta (p. ej. datos
// anteriores), el acumulado de la última estación. null si todavía no terminó.
function teamTotalSec(scores, config, team) {
  const own = parseScore(scores && scores.total && scores.total[team]);
  if (own !== null) return own;
  const last = String(config.events.length - 1);
  const evS = (scores && (scores[last] || scores[config.events.length - 1])) || {};
  return parseScore(evS[team]);
}

// La clasificación es por menor tiempo total (no hay puntos). Empates
// comparten rango; los equipos que todavía no tienen tiempo total van al
// final, sin rango.
function calcLeaderboard(teams, scores, config) {
  if (!teams || !teams.length) return [];
  const rows = teams.map(team => ({
    team,
    totalSec: teamTotalSec(scores, config, team),
    raw: config.events.map((_,ei) => {
      const evS = (scores && (scores[String(ei)] || scores[ei])) || {};
      return evS[team] || null;
    })
  }));
  rows.sort((a,b) => {
    if (a.totalSec === null || b.totalSec === null) return (a.totalSec === null) - (b.totalSec === null);
    return a.totalSec - b.totalSec;
  });
  let prev = null, prevRank = null;
  rows.forEach((r,i) => {
    if (r.totalSec === null) { r.rank = null; return; }
    r.rank = (prev !== null && r.totalSec === prev) ? prevRank : i + 1;
    prev = r.totalSec; prevRank = r.rank;
  });
  return rows;
}

// Red de seguridad: si hay cambios sin guardar (dirty), los guarda solo
// 1.2s después de la última edición (changeCount) y, si el panel se
// desmonta antes de eso (p.ej. cambiaste de pestaña o de género sin
// apretar "GUARDAR"), los manda igual antes de perderlos.
function useAutoSave(changeCount, dirty, run) {
  const runRef = useRef(run);
  useEffect(()=>{ runRef.current = run; });
  const dirtyRef = useRef(dirty);
  useEffect(()=>{ dirtyRef.current = dirty; });

  useEffect(()=>{
    if (!dirty) return;
    const t = setTimeout(()=>{ runRef.current(); }, 1200);
    return ()=>clearTimeout(t);
  }, [changeCount]);

  useEffect(()=>()=>{ if (dirtyRef.current) runRef.current(); }, []);
}

// true en pantallas angostas (celular): se usa para compactar el encabezado.
function useIsNarrow() {
  const q = '(max-width: 600px)';
  const [narrow, setNarrow] = useState(()=>window.matchMedia(q).matches);
  useEffect(()=>{
    const m = window.matchMedia(q);
    const onChange = ()=>setNarrow(m.matches);
    m.addEventListener('change', onChange);
    return ()=>m.removeEventListener('change', onChange);
  }, []);
  return narrow;
}

function ConfigPanel({config,onSave}) {
  const [name,setName]=useState(config.name);
  const [events,setEvents]=useState(config.events.map(e=>({...e})));
  const [dirty,setDirty]=useState(false);
  const [changeCount,setChangeCount]=useState(0);
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  const [error,setError]=useState(false);
  const markChanged=()=>{ setDirty(true); setChangeCount(c=>c+1); };
  const changeName=v=>{ setName(v); markChanged(); };
  const changeEventName=(i,v)=>{ setEvents(prev=>prev.map((x,j)=>j===i?{...x,name:v}:x)); markChanged(); };
  const changeEventSub=(i,v)=>{ setEvents(prev=>prev.map((x,j)=>j===i?{...x,sub:v}:x)); markChanged(); };
  const addEstacion=()=>{ setEvents(prev=>[...prev,{name:'Estación '+(prev.length+1), sub:'', unit:'tiempo', lower:true}]); markChanged(); };
  const removeLastEstacion=()=>{ if(events.length<=1) return; setEvents(prev=>prev.slice(0,-1)); markChanged(); };
  const handleSave=async()=>{
    setSaving(true); setError(false);
    try{
      await onSave({name,events});
      setDirty(false); setSaved(true);
      setTimeout(()=>setSaved(false),2500);
    }catch(e){
      console.error('Save failed:',e);
      setError(true);
      setTimeout(()=>setError(false),4000);
    }finally{
      setSaving(false);
    }
  };
  useAutoSave(changeCount, dirty, handleSave);
  const inp={display:'block',width:'100%',background:FIELD_BG,border:'1px solid '+BORDER_STRONG,borderRadius:6,color:T1,padding:'9px 11px',fontSize:13};
  return h('div',{style:{padding:16}},
    h('div',{style:{fontSize:11,fontWeight:700,color:GOLD,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:14}},'⚙ Configuración General'),
    h('span',{style:{fontSize:10,color:T5,textTransform:'uppercase',letterSpacing:'0.08em',display:'block',marginBottom:5}},'Nombre de la competencia'),
    h('input',{value:name,onChange:e=>changeName(e.target.value),style:{...inp,fontSize:16,fontWeight:700,marginBottom:14}}),
    h('span',{style:{fontSize:10,color:T5,textTransform:'uppercase',letterSpacing:'0.08em',display:'block',marginBottom:4}},'Estaciones ('+events.length+')'),
    h('p',{style:{fontSize:11,color:T5,marginBottom:10}},'⏱ Los tiempos se cargan acumulados (mm:ss); la última estación lleva el tiempo total. La tabla muestra el tiempo de cada tramo.'),
    ...events.map((ev,i)=>
      h('div',{key:i,style:{background:SURFACE_ALT,border:'1px solid '+BORDER,borderRadius:8,padding:'10px 12px',marginBottom:8,display:'flex',gap:8,flexWrap:'wrap'}},
        h('input',{value:ev.name,onChange:e=>changeEventName(i,e.target.value),placeholder:'Estación '+(i+1),style:{...inp,flex:'1 1 140px',width:'auto'}}),
        h('input',{value:ev.sub||'',onChange:e=>changeEventSub(i,e.target.value),placeholder:'Ejercicio (ej. Ski)',style:{...inp,flex:'1 1 180px',width:'auto'}})
      )
    ),
    h('div',{style:{display:'flex',gap:8,marginBottom:16}},
      h('button',{onClick:addEstacion,style:{flex:1,padding:'9px',background:'none',border:'1px dashed '+BORDER_STRONG,borderRadius:8,color:T4,cursor:'pointer',fontSize:12,fontWeight:700}},'+ Agregar estación'),
      h('button',{onClick:removeLastEstacion,disabled:events.length<=1,style:{padding:'9px 14px',background:'none',border:'1px solid '+BORDER_STRONG,borderRadius:8,color:events.length<=1?T7:'#F87171',cursor:events.length<=1?'default':'pointer',fontSize:12,fontWeight:700,whiteSpace:'nowrap'}},'🗑 Quitar última')
    ),
    h('div',{style:{display:'flex',alignItems:'center',gap:10,marginTop:4}},
      h('button',{
        onClick:handleSave,
        disabled:!dirty||saving,
        style:{
          flex:1, padding:'11px',
          background:error?'#DC2626':saved?'#1D4ED8':dirty?GOLD_BTN:SURFACE_ALT,
          border:'1px solid '+(error?'#EF4444':saved?'#1D4ED8':dirty?GOLD_BTN:BORDER),
          borderRadius:8, color:dirty||saved||error?'white':T5,
          cursor:dirty?'pointer':'default',
          fontSize:13, fontWeight:800, letterSpacing:'0.02em',
          transition:'all 0.2s'
        }
      }, saving?'GUARDANDO...':saved?'✓ GUARDADO':error?'✕ ERROR AL GUARDAR — REINTENTAR':dirty?'GUARDAR CONFIGURACIÓN':'SIN CAMBIOS PENDIENTES'),
      dirty&&!saving&&h('span',{style:{fontSize:10,color:'#FB923C',letterSpacing:'0.06em',flexShrink:0}},'● sin guardar')
    )
  );
}

function TeamsPanel({teams,levels,onSave}) {
  const emptyMembers=()=>['','',''];
  const [list,setList]=useState(teams.map(t=>({...t,members:t.members&&t.members.length===3?[...t.members]:emptyMembers()})));
  const [val,setVal]=useState('');
  const [newMod,setNewMod]=useState(null);
  const [editIdx,setEditIdx]=useState(null);
  const [editVal,setEditVal]=useState('');
  const [dirty,setDirty]=useState(false);
  const [changeCount,setChangeCount]=useState(0);
  const [savingLocal,setSavingLocal]=useState(false);
  const [saved,setSaved]=useState(false);
  const [addError,setAddError]=useState('');
  const [editError,setEditError]=useState('');
  const markChanged=()=>{ setDirty(true); setChangeCount(c=>c+1); };

  // La modalidad elegida queda marcada después de agregar, para cargar varios
  // equipos seguidos de la misma modalidad sin volver a elegirla.
  const add=()=>{
    const t=val.trim();
    if(!t){ setAddError('Escribí un nombre'); return; }
    if(list.some(x=>x.name.toLowerCase()===t.toLowerCase())){ setAddError('Ya existe un equipo con ese nombre'); return; }
    setAddError('');
    const u=[...list,{name:t,level:null,modalidad:newMod,members:emptyMembers()}]; setList(u); setVal(''); markChanged();
  };
  const toggleModalidad=(i,m)=>{
    const u=list.map((x,j)=>j===i?{...x,modalidad:x.modalidad===m?null:m}:x); setList(u); markChanged();
  };
  const toggleOculto=(i)=>{
    const u=list.map((x,j)=>j===i?{...x,oculto:!x.oculto}:x); setList(u); markChanged();
  };
  const del=(name)=>{ const u=list.filter(x=>x.name!==name); setList(u); markChanged(); };
  const startEdit=(i)=>{ setEditIdx(i); setEditVal(list[i].name); setEditError(''); };
  const confirmEdit=(i)=>{
    const t=editVal.trim();
    if(!t){ setEditError('Escribí un nombre'); return; }
    if(list.some((x,j)=>j!==i&&x.name.toLowerCase()===t.toLowerCase())){ setEditError('Ya existe un equipo con ese nombre'); return; }
    const u=list.map((x,j)=>j===i?{...x,name:t}:x); setList(u); markChanged(); setEditIdx(null); setEditError('');
  };
  const toggleLevel=(i,lv)=>{
    const u=list.map((x,j)=>j===i?{...x,level:x.level===lv?null:lv}:x); setList(u); markChanged();
  };
  const updateMember=(i,mi,memberVal)=>{
    const u=list.map((x,j)=>{
      if(j!==i)return x;
      const members=x.members?[...x.members]:emptyMembers();
      members[mi]=memberVal;
      return {...x,members};
    });
    setList(u); markChanged();
  };
  const [saveError,setSaveError]=useState(false);
  const handleSave=async()=>{
    setSavingLocal(true);
    setSaveError(false);
    try{
      await onSave(list);
      setDirty(false);
      setSaved(true);
      setTimeout(()=>setSaved(false),2500);
    }catch(e){
      console.error('Save failed:',e);
      setSaveError(true);
      setTimeout(()=>setSaveError(false),4000);
    }finally{
      setSavingLocal(false);
    }
  };
  useAutoSave(changeCount, dirty, handleSave);

  const unassigned=list.filter(x=>!x.level).length;
  const lvlPillS=(active)=>({padding:'4px 10px',background:active?GOLD+'14':'none',border:'1px solid '+(active?GOLD:BORDER_STRONG),borderRadius:5,color:active?GOLD:T5,cursor:'pointer',fontSize:10,fontWeight:700,whiteSpace:'nowrap'});
  return h('div',{style:{padding:16}},
    h('div',{style:{fontSize:11,fontWeight:700,color:GOLD,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:4}},'👥 Equipos'),

// ── App ───────────────────────────────────────────────────
function App() {
  const [selLevel,setSelLevel]=useState(LEVELS[0]);
  const [baseConfig,setBaseConfig]=useState(BASE_CONFIG);
  const [teams,setTeams]=useState([]);    // [{name, level:null|'Chill'|'Picante', members}]
  const [scores,setScores]=useState({});  // {nivel: {0:{equipo:tiempo},1:{},...}}
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [session,setSession]=useState(null);
  const [sessionChecked,setSessionChecked]=useState(false);
  const isAdmin=!!session;
  const [showLogin,setShowLogin]=useState(false);
  const [showSchedule,setShowSchedule]=useState(false);
  const [siteHidden,setSiteHidden]=useState(false);
  const narrow=useIsNarrow();
  const [aTab,setATab]=useState('teams');
  const scoreTimer=useRef({});

  // Reloj para el bloqueo temporal del cronograma: se re-chequea solo, sin
  // necesidad de refrescar la página, para destrabarse apenas pasa la hora.
  const [now,setNow]=useState(()=>Date.now());
  useEffect(()=>{
    const id=setInterval(()=>setNow(Date.now()), 30000);
    return ()=>clearInterval(id);
  },[]);
  const scheduleLocked = SCHEDULE_LOCK_ENABLED && sessionChecked && !isAdmin && now < SCHEDULE_LOCK_UNTIL.getTime();
  const publicHidden = sessionChecked && !isAdmin && siteHidden;

  const [selMod,setSelMod]=useState(null); // filtro de modalidad (null = todas)
  // Solo los ya asignados a la categoría actual (los sin asignar no entran a ninguna
  // tabla) y que no estén marcados como ocultos (anotados que no se presentan).
  const curTeams=teams.filter(t=>t.level===selLevel&&!t.oculto).map(t=>t.name);
  const modCounts={}; MODALIDADES.forEach(m=>{ modCounts[m]=teams.filter(t=>t.level===selLevel&&!t.oculto&&t.modalidad===m).length; });
  const showModFilter=MODALIDADES.some(m=>modCounts[m]>0);
  const filterMod=showModFilter?selMod:null;
  const lbTeams=filterMod?teams.filter(t=>t.level===selLevel&&!t.oculto&&t.modalidad===filterMod).map(t=>t.name):curTeams;
  const teamMembers={}; const teamModalidad={};
  teams.forEach(t=>{ teamMembers[t.name]=t.members||[]; teamModalidad[t.name]=t.modalidad||null; }); // nombre -> integrantes / modalidad
  const curScores=scores[selLevel]||{};
  const config=baseConfig;

  // Sesión de admin: se restaura sola si ya había una guardada, y se mantiene
  // al día ante login/logout/renovación de token.
  useEffect(()=>{
    sbClient.auth.getSession().then(({data})=>{ setSession(data.session); setSessionChecked(true); });
    const {data:sub}=sbClient.auth.onAuthStateChange((_event,newSession)=>setSession(newSession));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  // Carga inicial desde Supabase
  useEffect(()=>{
    async function loadAll(){
      setLoading(true);
      const results=await Promise.all([
        dbGet(CONFIG_KEY).then(d=>['config',null,d]),
        dbGet('config').then(d=>['oldConfig',null,d]),
        dbGet('hidden').then(d=>['hidden',null,d]),
        dbGet(TEAMS_KEY).then(d=>['teams',null,d]),
        ...LEVELS.map(l=>dbGet(scoresKey(l)).then(d=>['scores',l,d])),
      ]);
      let cfg=null, oldCfg=null, newTeams=[];
      const newScores={};
      results.forEach(([type,key,data])=>{
        if(type==='config'){ cfg=data; return; }
        if(type==='oldConfig'){ oldCfg=data; return; }
        if(type==='hidden'){ setSiteHidden(!!data); return; }
        if(!data)return;
        if(type==='teams') newTeams=Array.isArray(data)?data:[];
        if(type==='scores') newScores[key]=data;
      });

      // Config de estaciones: si todavía no se guardó ninguna, arranca con las
      // 8 estaciones por defecto y solo hereda el nombre de la competencia
      // anterior (la config vieja queda intacta en la base, no se lee más).
      if(cfg) setBaseConfig(withDefaultSubs(cfg));
      else if(oldCfg&&oldCfg.name) setBaseConfig({...BASE_CONFIG,name:oldCfg.name});
      setTeams(newTeams);
      setScores(newScores);
      setLoading(false);
    }
    loadAll();
  },[]);

  // saveTeams: guardado directo, devuelve promise para que TeamsPanel pueda hacer await
  const saveTeams=async(newList)=>{
    setTeams(newList);
    setSaving(true);
    await dbSet(TEAMS_KEY, newList);
    setSaving(false);
  };

  // moveTeam: reordena el orden de exhibición (solo tiene efecto visible
  // mientras no haya resultados cargados; apenas hay tiempos cargados, el orden
  // real pasa a decidirlo calcLeaderboard).
  const moveTeam=(name,dir)=>{
    const idx=curTeams.indexOf(name);
    const otherName=curTeams[idx+dir];
    if(!otherName) return;
    const newTeams=[...teams];
    const i1=newTeams.findIndex(t=>t.name===name);
    const i2=newTeams.findIndex(t=>t.name===otherName);
    [newTeams[i1],newTeams[i2]]=[newTeams[i2],newTeams[i1]];
    saveTeams(newTeams);
  };

  // saveConfig: guardado directo, devuelve promise para que ConfigPanel pueda hacer await
  const saveConfig=async(cfg)=>{
    setBaseConfig(cfg);
    setSaving(true);
    await dbSet(CONFIG_KEY,cfg);
    setSaving(false);
  };

  // toggleHidden: oculta/muestra el leaderboard para todo el mundo menos
  // el admin logueado. Se guarda en la base, así que aplica para cualquiera
  // que entre, no solo en este navegador.
  const toggleHidden=async()=>{
    const next=!siteHidden;
    setSiteHidden(next);
    setSaving(true);
    await dbSet('hidden', next);
    setSaving(false);
  };

  // updateScore: debounce mientras tipea
  const updateScore=(ei,team,val)=>{
    const key=scoresKey(selLevel);
    const newScoresCat={...curScores,[String(ei)]:{...((curScores[String(ei)]||curScores[ei])||{}),[team]:val}};
    setScores(prev=>({...prev,[selLevel]:newScoresCat}));
    setSaving(true);
    clearTimeout(scoreTimer.current[key]);
    scoreTimer.current[key]=setTimeout(async()=>{
      await dbSet(key,newScoresCat);
      setSaving(false);
    },600);
  };

  const [showConfirm,setShowConfirm]=useState(false);
  const [clearing,setClearing]=useState(false);

  const handleClearScores=async()=>{
    setClearing(true);
    try{
      await dbDeleteScores();
      setScores({});
    }catch(e){
      alert('Error al limpiar resultados: '+e.message);
    }finally{
      setClearing(false);
      setShowConfirm(false);
    }
  };

  const [showConfirmTeams,setShowConfirmTeams]=useState(false);
  const [clearingTeams,setClearingTeams]=useState(false);

  const handleClearTeams=async()=>{
    setClearingTeams(true);
    try{
      await dbDeleteTeams();
      await dbDeleteScores();
      setTeams([]);
      setScores({});
    }catch(e){
      alert('Error al borrar equipos: '+e.message);
    }finally{
      setClearingTeams(false);
      setShowConfirmTeams(false);
    }
  };

  if(!sessionChecked) return null;
  if(scheduleLocked) return h(React.Fragment,null,
    showLogin&&h(LoginModal,{onLogin:()=>setShowLogin(false),onClose:()=>setShowLogin(false)}),
    h(ScheduleLockScreen,{items:SCHEDULE_ITEMS,onAdminClick:()=>setShowLogin(true)})
  );
  if(publicHidden) return h(React.Fragment,null,
    showLogin&&h(LoginModal,{onLogin:()=>setShowLogin(false),onClose:()=>setShowLogin(false)}),
    h(HiddenScreen,{onAdminClick:()=>setShowLogin(true)})
  );

  // Con filtro de modalidad el ranking se recalcula solo entre esos equipos.
  const lb=calcLeaderboard(lbTeams,curScores,config);

  const btnPad=narrow?'6px 10px':'7px 14px';
  const lvlS=(l)=>({flex:narrow?1:'none',textAlign:'center',padding:narrow?'7px 14px':'8px 16px',background:selLevel===l?GOLD+'14':'none',border:'1px solid '+(selLevel===l?GOLD:BORDER),borderRadius:6,color:selLevel===l?GOLD:T5,cursor:'pointer',fontSize:12,fontWeight:700,letterSpacing:'0.06em',whiteSpace:'nowrap'});
  const modS=(active)=>({padding:narrow?'6px 12px':'6px 14px',background:active?GOLD+'22':SURFACE,border:'1px solid '+(active?GOLD:BORDER_STRONG),borderRadius:6,color:active?GOLD:ON_BG,cursor:'pointer',fontSize:12,fontWeight:700,letterSpacing:'0.04em',whiteSpace:'nowrap',flexShrink:0});
  const atS =(t)=>({padding:'7px 14px',background:aTab===t?ACCENT+'14':'none',border:'1px solid '+(aTab===t?ACCENT:BORDER),borderRadius:6,color:aTab===t?ACCENT:T5,cursor:'pointer',fontSize:11,fontWeight:600,letterSpacing:'0.04em'});

  return h('div',{style:{minHeight:'100vh',display:'flex',flexDirection:'column'}},

    showLogin&&h(LoginModal,{onLogin:()=>setShowLogin(false),onClose:()=>setShowLogin(false)}),
    showSchedule&&h(ScheduleModal,{items:SCHEDULE_ITEMS,onClose:()=>setShowSchedule(false)}),

    // Confirm modal (limpiar resultados)
    showConfirm&&h('div',{style:{position:'fixed',inset:0,background:'rgba(5,3,22,0.72)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:500}},
      h('div',{style:{background:SURFACE,border:'1px solid rgba(248,113,113,0.55)',borderRadius:12,padding:28,width:'min(360px,92%)',textAlign:'center',boxShadow:'0 12px 32px rgba(23,26,31,0.14)'}},
        h('div',{style:{fontSize:36,marginBottom:12}},'⚠️'),
        h('h3',{style:{color:'#F87171',fontSize:15,fontWeight:700,margin:'0 0 8px'}},'Limpiar todos los resultados'),
        h('p',{style:{color:T3,fontSize:13,marginBottom:20,lineHeight:1.5}},'Se van a eliminar los resultados de ',h('strong',{style:{color:T1}},'Chill y Picante'),' de forma permanente (los de competencias anteriores no se tocan). Los equipos no se borran.'),
        h('div',{style:{display:'flex',gap:10}},
          h('button',{onClick:()=>setShowConfirm(false),style:{flex:1,padding:'11px',background:'none',border:'1px solid '+BORDER_STRONG,borderRadius:8,color:T4,cursor:'pointer',fontSize:13}},'Cancelar'),
          h('button',{onClick:handleClearScores,disabled:clearing,style:{flex:1,padding:'11px',background:'#DC2626',border:'none',borderRadius:8,color:'white',cursor:'pointer',fontSize:13,fontWeight:700}},
            clearing?'LIMPIANDO...':'SÍ, LIMPIAR TODO'
          )
        )
      )
    ),

    // Confirm modal (borrar equipos)
    showConfirmTeams&&h('div',{style:{position:'fixed',inset:0,background:'rgba(5,3,22,0.72)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:500}},
      h('div',{style:{background:SURFACE,border:'1px solid rgba(248,113,113,0.55)',borderRadius:12,padding:28,width:'min(360px,92%)',textAlign:'center',boxShadow:'0 12px 32px rgba(23,26,31,0.14)'}},
        h('div',{style:{fontSize:36,marginBottom:12}},'⚠️'),
        h('h3',{style:{color:'#F87171',fontSize:15,fontWeight:700,margin:'0 0 8px'}},'Borrar todos los equipos'),
        h('p',{style:{color:T3,fontSize:13,marginBottom:20,lineHeight:1.5}},'Se van a eliminar ',h('strong',{style:{color:T1}},'todos los equipos de Chill y Picante'),' de forma permanente, junto con sus resultados (los de competencias anteriores no se tocan). Esta acción no se puede deshacer.'),
        h('div',{style:{display:'flex',gap:10}},
          h('button',{onClick:()=>setShowConfirmTeams(false),style:{flex:1,padding:'11px',background:'none',border:'1px solid '+BORDER_STRONG,borderRadius:8,color:T4,cursor:'pointer',fontSize:13}},'Cancelar'),
          h('button',{onClick:handleClearTeams,disabled:clearingTeams,style:{flex:1,padding:'11px',background:'#DC2626',border:'none',borderRadius:8,color:'white',cursor:'pointer',fontSize:13,fontWeight:700}},
            clearingTeams?'BORRANDO...':'SÍ, BORRAR TODO'
          )
        )
      )
    ),
    h('div',{style:{background:SURFACE,borderBottom:'1px solid '+BORDER,padding:narrow?'8px 12px 10px':'14px 16px'}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:narrow?8:14,flexWrap:'wrap',gap:narrow?6:8}},
        h('div',{style:{flex:'1 1 auto',minWidth:0}},
          h('div',{style:{display:'flex',alignItems:'center',gap:narrow?8:10}},
            h('div',{style:{fontSize:narrow?15:20,fontWeight:900,color:T1,letterSpacing:narrow?'0.03em':'0.05em',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',minWidth:0}},'🏆 '+(loading?'...':baseConfig.name)),
            h('button',{onClick:()=>setShowSchedule(true),title:'Cronograma','aria-label':'Cronograma',style:{background:SURFACE_ALT,border:'1px solid '+BORDER_STRONG,borderRadius:6,color:T3,cursor:'pointer',fontSize:11,padding:narrow?'5px 9px':'5px 11px',fontWeight:700,letterSpacing:'0.03em',whiteSpace:'nowrap',flexShrink:0}},narrow?'📅':'📅 Cronograma')
          ),
          saving&&h('div',{style:{fontSize:9,color:T5,letterSpacing:'0.08em',marginTop:3}},'GUARDANDO...')
        ),
        h('div',{style:{display:'flex',gap:narrow?6:8,alignItems:'center',flexWrap:'wrap',flex:'0 1 auto',maxWidth:'100%',justifyContent:'flex-end'}},
          isAdmin&&h('button',{
            onClick:toggleHidden,
            style:{background:siteHidden?'rgba(245,158,11,0.18)':SURFACE_ALT,border:'1px solid '+(siteHidden?'#F59E0B':BORDER_STRONG),borderRadius:6,color:siteHidden?'#FBBF24':T3,cursor:'pointer',fontSize:11,padding:btnPad,fontWeight:700,letterSpacing:'0.05em',whiteSpace:'nowrap'}
          },siteHidden?'👁 Mostrar':'🙈 Ocultar'),
          isAdmin&&h('button',{
            onClick:()=>setShowConfirmTeams(true),
            style:{background:'rgba(220,38,38,0.16)',border:'1px solid rgba(248,113,113,0.6)',borderRadius:6,color:'#F87171',cursor:'pointer',fontSize:11,padding:btnPad,fontWeight:700,letterSpacing:'0.05em',whiteSpace:'nowrap'}
          },'🗑 Borrar equipos'),
          isAdmin&&h('button',{
            onClick:()=>setShowConfirm(true),
            style:{background:'rgba(220,38,38,0.16)',border:'1px solid rgba(248,113,113,0.6)',borderRadius:6,color:'#F87171',cursor:'pointer',fontSize:11,padding:btnPad,fontWeight:700,letterSpacing:'0.05em',whiteSpace:'nowrap'}
          },'🗑 Limpiar resultados'),
          isAdmin
            ?h('button',{onClick:()=>sbClient.auth.signOut(),style:{background:ACCENT,border:'none',borderRadius:6,color:'white',cursor:'pointer',fontSize:11,padding:btnPad,fontWeight:800,letterSpacing:'0.07em'}},'● ADMIN')
            :h('button',{onClick:()=>setShowLogin(true),style:{background:'none',border:'1px solid '+BORDER_STRONG,borderRadius:6,color:T5,cursor:'pointer',fontSize:11,padding:btnPad,letterSpacing:'0.07em'}},'ADMIN')
        )
      ),
      h('div',{style:{display:'flex',gap:6,overflowX:'auto'}},
        LEVELS.map(l=>h('button',{key:l,onClick:()=>setSelLevel(l),style:lvlS(l)},l))
      )
    ),

    h('div',{style:{padding:narrow?'6px 12px':'10px 16px',background:SURFACE_ALT,borderBottom:'1px solid '+BORDER,display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:6}},
      h('div',{style:{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}},
        !narrow&&h('span',{style:{fontSize:15,fontWeight:800,color:T2,letterSpacing:'0.04em'}},selLevel),
        h('span',{style:{fontSize:11,color:narrow?T4:T6}},curTeams.length+' equipos')
      ),
      lb.length>0&&h('span',{style:{fontSize:9,color:GOLD,letterSpacing:'0.09em',fontWeight:700}},'CLASIFICACIÓN EN VIVO')
    ),

    h('div',{style:{padding:narrow?8:14,flex:1}},
      loading
        ?h('div',{style:{textAlign:'center',padding:50,color:ON_BG,letterSpacing:'0.1em',fontSize:12}},'CONECTANDO A BASE DE DATOS...')
        :h(React.Fragment,null,
            showModFilter&&h('div',{style:{display:'flex',gap:6,alignItems:'center',marginBottom:narrow?8:10,overflowX:'auto'}},
              h('span',{style:{fontSize:10,color:ON_BG,letterSpacing:'0.06em',textTransform:'uppercase',fontWeight:700,flexShrink:0}},'Ver'),
              [null,...MODALIDADES].map(m=>h('button',{key:m||'todos',onClick:()=>setSelMod(m),style:modS(filterMod===m)},
                m?m+' · '+modCounts[m]:'Todos · '+curTeams.length))
            ),
            h(Leaderboard,{entries:lb,config,teamMembers,teamModalidad,canReorder:isAdmin&&!filterMod,onMove:moveTeam})
          )
    ),

    isAdmin&&h('div',{style:{margin:narrow?'0 8px 8px':'0 14px 14px',background:SURFACE,border:'1px solid '+BORDER,borderRadius:10,overflow:'hidden'}},
      h('div',{style:{display:'flex',gap:6,padding:'10px 12px',borderBottom:'1px solid '+BORDER_SOFT}},
        h('button',{onClick:()=>setATab('teams'), style:atS('teams') },'👥 Equipos'),
        h('button',{onClick:()=>setATab('scores'),style:atS('scores')},'📊 Resultados'),
        h('button',{onClick:()=>setATab('config'),style:atS('config')},'⚙ Config')
      ),
      aTab==='teams' &&h(TeamsPanel, {key:'teams',teams,levels:LEVELS,onSave:saveTeams}),
      aTab==='scores'&&h(ScoresPanel,{key:'s-'+selLevel,teams:curTeams,scores:curScores,config,onUpdate:updateScore}),
      aTab==='config'&&h(ConfigPanel,{config:baseConfig,onSave:saveConfig})
    ),

    h('div',{style:{padding:'8px 16px',borderTop:'1px solid '+BORDER_SOFT,display:'flex',justifyContent:'space-between',alignItems:'center'}},
      h('span',{style:{fontSize:9,color:ON_BG,letterSpacing:'0.08em'}},'Gana el menor tiempo total · Empates comparten rango'),
      h('span',{style:{fontSize:9,color:ON_BG}},LEVELS.length+' categorías')
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
